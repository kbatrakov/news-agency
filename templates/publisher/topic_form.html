{% extends "base.html" %}
{% load crispy_forms_filters %}
{% block content %}
  <h1>{{ object|yesno:"Update, Create" }} topic</h1>
  <form action="" method="post" novalidate>
    {% csrf_token %}
    {{ form|crispy }}
    <input type="submit" value="Create" class="btn btn-outline-primary">
    <input type="button" value="Cancel" class="btn-outline-secondary" onclick="history.back()">
  </form>
{% endblock %}
