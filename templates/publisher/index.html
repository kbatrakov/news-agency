{% extends "base.html" %}

{% block content %}

<div class="container">

    <!-- 📰 ARTICLES -->
    <section class="mt-4">

        <h2 class="fw-bold mb-4">Latest Articles</h2>

        <div class="row g-4">

            {% for article in articles %}
            <div class="col-12 col-md-6 col-lg-4">

                <div class="card h-100 shadow-sm border-0">

                    <div class="card-body d-flex flex-column">

                        <h5 class="fw-bold">
                            {{ article.title }}
                        </h5>

                        <p class="text-muted">
                            {{ article.preview }}
                        </p>

                        <div class="mt-auto">
                            <a href="{{ article.get_absolute_url }}"
                               class="btn btn-primary btn-sm">
                                Read more
                            </a>
                        </div>

                    </div>

                </div>

            </div>
            {% endfor %}

        </div>
    </section>

</div>


<!-- 📊 STATS FOOTER (ВНИЗУ СТРАНИЦЫ) -->
<footer class="mt-5 bg-light border-top py-5">

    <div class="container">

        <h5 class="text-center text-muted mb-4">
            Platform statistics
        </h5>

        <div class="row g-4 text-center">

            <div class="col-12 col-md-4">
                <div class="p-3">
                    <div class="text-primary fw-bold">Editors</div>
                    <div class="display-6 fw-bold">{{ num_editors }}</div>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="p-3">
                    <div class="text-success fw-bold">Topics</div>
                    <div class="display-6 fw-bold">{{ num_topics }}</div>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="p-3">
                    <div class="text-warning fw-bold">Newspapers</div>
                    <div class="display-6 fw-bold">{{ num_newspapers }}</div>
                </div>
            </div>

        </div>

    </div>

</footer>

{% endblock %}
